[package]
name = "strata"
version = "0.1.0"
description = "Modern open-source cloud sync & virtual drive client powered by rclone rcd"
authors = ["SolidStateNetwork and Strata Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/SolidStateNetwork/Strata"
edition = "2024"

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
